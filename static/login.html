<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d6a48">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Budget · Sign in</title>
  <script src="/static/vendor/tailwind-3.4.17.js"></script>
  <script src="/static/theme.js"></script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-4 relative overflow-hidden" style="background:rgb(var(--field));color:#fff">
  <div aria-hidden="true" style="position:absolute;width:40rem;aspect-ratio:1;border-radius:9999px;right:-18rem;top:-20rem;background:rgb(var(--field-deep))"></div>
  <main class="w-full max-w-sm relative">
    <div class="flex flex-col items-center mb-6">
      <span class="inline-flex w-16 h-16 rounded-full bg-white items-center justify-center text-3xl font-black mb-3" style="color:rgb(var(--field))" aria-hidden="true">€</span>
      <h1 class="text-2xl font-black tracking-tight">Budget</h1>
      <p class="text-sm mt-1" style="color:rgb(255 255 255 / .86)">Sign in with your phone password</p>
    </div>
    <form id="f" class="bg-surface text-slate-800 rounded-[1.5rem] shadow-[0_20px_40px_-20px_rgb(0_0_0/.45)] p-5 space-y-4">
      <div>
        <label for="pw" class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus
               class="w-full rounded-xl border border-slate-200 bg-surface text-slate-900 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
      </div>
      <p id="err" class="hidden text-sm text-red-600"></p>
      <button class="w-full rounded-xl bg-slate-900 text-slate-50 font-semibold py-2.5 hover:bg-slate-800 disabled:opacity-50">Sign in</button>
      <p class="text-xs text-slate-500 text-center">You set this password on your Mac, in Budget → Settings → Phone access.</p>
    </form>
  </main>
  <script>
    const f = document.getElementById("f"), err = document.getElementById("err");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = f.querySelector("button");
      btn.disabled = true; err.classList.add("hidden");
      try {
        const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify({ password: document.getElementById("pw").value }) });
        if (res.ok) { location.replace("/"); return; }
        const j = await res.json().catch(() => ({}));
        err.textContent = j.detail || "Couldn't sign in";
      } catch { err.textContent = "Can't reach Budget. Is it open on your Mac, and are you on the same Wi-Fi?"; }
      err.classList.remove("hidden");
      btn.disabled = false;
    });
  </script>
</body>
</html>
