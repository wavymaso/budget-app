<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Budget · Sign in</title>
  <script src="/static/vendor/tailwind-3.4.17.js"></script>
  <script src="/static/theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center px-4">
  <main class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-6">
      <img src="/static/apple-touch-icon.png" alt="" class="w-16 h-16 rounded-2xl shadow-sm mb-3">
      <h1 class="text-xl font-semibold text-slate-900">Budget</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with your phone password</p>
    </div>
    <form id="f" class="bg-surface rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
      <div>
        <label for="pw" class="block text-xs font-medium text-slate-500 mb-1">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus
               class="w-full rounded-xl border border-slate-200 bg-surface text-slate-900 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-accent/20 focus:border-accent">
      </div>
      <p id="err" class="hidden text-sm text-red-600"></p>
      <button class="w-full rounded-xl bg-accent text-on-accent font-medium py-2.5 hover:opacity-90 disabled:opacity-50">Sign in</button>
      <p class="text-xs text-slate-400 text-center">You set this password on your Mac, in Budget → Settings → Phone access.</p>
    </form>
  </main>
  <script>
    const f = document.getElementById("f"), err = document.getElementById("err");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = f.querySelector("button");
      btn.disabled = true; err.classList.add("hidden");
      try {
        const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify({ password: document.getElementById("pw").value }) });
        if (res.ok) { location.replace("/"); return; }
        const j = await res.json().catch(() => ({}));
        err.textContent = j.detail || "Couldn't sign in";
      } catch { err.textContent = "Can't reach Budget. Is it open on your Mac, and are you on the same Wi-Fi?"; }
      err.classList.remove("hidden");
      btn.disabled = false;
    });
  </script>
</body>
</html>
